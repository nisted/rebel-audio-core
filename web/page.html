<script>
'use strict'
const $ = (s, el = document) => el.querySelector(s)
const $$ = (s, el = document) => [...el.querySelectorAll(s)]
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
let META = null
let S = null
const APP = '%APP_ID%'.replace(/[^a-z0-9]/gi, '')
let pin = localStorage.getItem(APP + '.pin') || ''
const dragging = new Set()
const peaks = {}
const strips = new Map()
const LS = (k, d) => { try { const v = localStorage.getItem(APP + '.' + k); return v === null ? d : JSON.parse(v) } catch { return d } }
const LSset = (k, v) => { try { localStorage.setItem(APP + '.' + k, JSON.stringify(v)) } catch {} }
const collapsed = LS('collapsed', {})
const perStrip = LS('strip', {}) // input id -> {pre, post, fine, width, pinned}
let es = null
let tab = 'page'

function q() { return pin ? '?pin=' + encodeURIComponent(pin) : '' }
function flash(text) { const m = $('#msg'); m.textContent = text; clearTimeout(flash.t); flash.t = setTimeout(() => (m.textContent = ''), 5000) }
function ps(name) { return (perStrip[name] ??= {}) }
function savePs() { LSset('strip', perStrip) }

function askPin() {
	const p = prompt('This page has a PIN. What is it?')
	if (p === null) return
	pin = p
	localStorage.setItem(APP + '.pin', pin)
	connectSource(HOME)
}

// ---- fader law (same as the core's law.ts) ----
const MIN_DB = -100
const MARKS = [[0.03, -80], [0.08, -60], [0.15, -50], [0.25, -40], [0.35, -30], [0.45, -20], [0.55, -12], [0.65, -6], [0.75, 0]]
function law() { const p = S.store.page; return { kind: p.law, top: p.faderTopDb, bottom: p.faderBottomDb } }
function posToDb(pos) {
	const L = law(), p = Math.max(0, Math.min(1, pos))
	if (p <= 0) return null
	if (L.kind === 'linear') return L.bottom + (L.top - L.bottom) * p
	if (p >= 0.75) return L.top <= 0 ? 0 : ((p - 0.75) / 0.25) * L.top
	if (p < MARKS[0][0]) return MIN_DB + ((MARKS[0][1] - MIN_DB) * p) / MARKS[0][0]
	for (let i = 1; i < MARKS.length; i++) { const [p1, d1] = MARKS[i], [p0, d0] = MARKS[i - 1]; if (p <= p1) return d0 + ((d1 - d0) * (p - p0)) / (p1 - p0) }
	return 0
}
function dbToPos(db) {
	const L = law()
	if (db === null || db <= MIN_DB) return 0
	if (L.kind === 'linear') return db <= L.bottom ? 0 : Math.max(0, Math.min(1, (db - L.bottom) / (L.top - L.bottom)))
	if (db >= 0) return L.top <= 0 ? 0.75 : Math.min(1, 0.75 + (db / L.top) * 0.25)
	if (db <= MARKS[0][1]) return Math.max(0, ((db - MIN_DB) / (MARKS[0][1] - MIN_DB)) * MARKS[0][0])
	for (let i = 1; i < MARKS.length; i++) { const [p1, d1] = MARKS[i], [pa, da] = MARKS[i - 1]; if (db <= d1) return pa + ((p1 - pa) * (db - da)) / (d1 - da) }
	return 0.75
}
const fmt = (db, d = 1) => (db === null || db === undefined ? '-∞' : (db > 0 ? '+' : '') + Number(db).toFixed(d))
function mFrac(db) { const p = S.store.page; if (db === null || db === undefined) return 0; return Math.max(0, Math.min(1, (db - p.meterFloorDb) / (p.meterTopDb - p.meterFloorDb))) }
function zoneGradient(rows, pale) {
	const p = S.store.page
	const g = mFrac(p.greenToDb) * 100, y = mFrac(p.yellowToDb) * 100
	const c = (col) => (pale === undefined ? col : `color-mix(in srgb, ${col} ${Math.round(Math.max(0, Math.min(1, pale)) * 100)}%, #050507)`)
	return `linear-gradient(${rows ? 'to right' : 'to top'}, ${c(p.greenColour)} 0%, ${c(p.greenColour)} ${g}%, ${c(p.yellowColour)} ${g}%, ${c(p.yellowColour)} ${y}%, ${c(p.redColour)} ${y}%, ${c(p.redColour)} 100%)`
}

// ---- tooltips (a setting can turn them off) ----
const tt = $('#tooltip')
let ttTimer = null
document.addEventListener('mouseover', (e) => {
	const el = e.target.closest('[data-tip]')
	clearTimeout(ttTimer)
	tt.style.display = 'none'
	if (!el || !el.dataset.tip || !S || !S.store.page.tooltips) return
	ttTimer = setTimeout(() => {
		tt.textContent = el.dataset.tip
		tt.style.display = 'block'
		const r = el.getBoundingClientRect()
		const w = tt.offsetWidth, h = tt.offsetHeight
		tt.style.left = Math.max(4, Math.min(innerWidth - w - 4, r.left)) + 'px'
		tt.style.top = (r.bottom + h + 8 > innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px'
	}, 450)
})
document.addEventListener('pointerdown', () => { clearTimeout(ttTimer); tt.style.display = 'none' })

setInterval(() => { $('#clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); tickNext() }, 1000)

// ---- header ----
function renderHeader() {
	$('#led').classList.toggle('ok', S.connected)
	$('#led').parentElement.dataset.tip = S.connected ? `Connected to ${META.device.label}. All good.` : (S.deviceError || `Not connected to ${META.device.label}`)
	const r = S.recording
	$('#bRec').style.display = r.available ? '' : 'none'
	$('#bRec').classList.toggle('on', r.active)
	$('#bRec').textContent = r.active ? (r.paused ? '❚❚ PAUSED' : '■ STOP REC') : '● REC'
	$('#recTime').textContent = r.active ? (r.timecode || '').split('.')[0] : ''
	$('#bPfl').textContent = S.store.page.pflMode === 'exclusive' ? 'PFL EXCL' : 'PFL ADD'
	$('#cLatch').checked = S.store.page.soloLatch
	$('#cMatch').checked = LS('match', false)
	const V = S.versions || {}
	const upd = [V.moduleUpdate && 'MODULE ' + V.moduleLatest, V.deviceUpdate && (V.deviceLabel || '').toUpperCase() + ' ' + V.deviceLatest].filter(Boolean)
	$('#upd').style.display = upd.length ? '' : 'none'
	$('#upd').textContent = 'UPDATE: ' + upd.join(', ')
	tickNext()
}
function tickNext() {
	if (!S) return
	const plan = S.recording.plan
	const el = $('#next')
	if (!plan.nextStart || S.recording.active) { el.textContent = ''; return }
	const t = new Date(plan.nextStart)
	const s = Math.round((t - Date.now()) / 1000)
	const a = Math.abs(s), hh = Math.floor(a / 3600), mm = Math.floor((a % 3600) / 60), ss = a % 60
	const cd = (s < 0 ? '-' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0')
	el.textContent = `NEXT REC ${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}${plan.autoStart ? ' AUTO' : ''} · ${cd}`
}
$('#bPfl').onclick = () => cmd({ cmd: 'page', key: 'pflMode', value: S.store.page.pflMode === 'exclusive' ? 'additive' : 'exclusive' })
$('#cLatch').onchange = (e) => cmd({ cmd: 'page', key: 'soloLatch', value: e.target.checked })
$('#cMatch').onchange = (e) => { LSset('match', e.target.checked); if (e.target.checked) { const keys = [...strips.keys()]; const w = Math.max(340, ...keys.map((k) => ps(k).width || 340)); for (const k of keys) ps(k).width = w; savePs(); render() } }
$('#bRec').onclick = () => (S.recording.active ? stopFlow() : cmd({ cmd: 'recordStart' }))
$('#upd').onclick = () => openSettings('about')
$('#bSettings').onclick = () => ($('#settings').classList.contains('open') ? $('#settings').classList.remove('open') : openSettings(tab))
$('#setClose').onclick = () => $('#settings').classList.remove('open')

// ---- small floating dialog (doesn't block the page) ----
function dialog(title, html, wire) {
	$('#dlgTitle').textContent = title
	$('#dlgBody').innerHTML = html
	$('#dlg').classList.add('open')
	wire($('#dlgBody'))
}
const closeDialog = () => $('#dlg').classList.remove('open')
$('#dlgX').onclick = closeDialog

function stopFlow() {
	dialog('STOP RECORDING', `<h3>Stop recording?</h3><div class="btns"><button class="primary" id="s1">Stop</button><button id="sc">Cancel</button></div>`, (b) => {
		$('#sc', b).onclick = closeDialog
		$('#s1', b).onclick = () => dialog('STOP RECORDING', `<h3>Are you definitely sure?</h3><p class="help">You\'ve got ${esc((S.recording.timecode || '').split('.')[0])} in the can so far.</p><div class="btns"><button class="primary" id="s2">Yes, I'm definitely sure</button><button id="sc">Cancel</button></div>`, (b2) => {
			$('#sc', b2).onclick = closeDialog
			$('#s2', b2).onclick = async () => { await cmd({ cmd: 'recordStop' }); planFlow() }
		})
	})
}

function planFlow(title = 'RECORDING STOPPED') {
	const d = new Date()
	const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
	dialog(title, `<h3>When is recording due to restart?</h3>
		<div class="row"><span class="lbl">Date</span><input type="date" id="pd" value="${today}"></div>
		<div class="row"><span class="lbl">Time</span><input type="time" id="pt"></div>
		<label class="chk"><input type="checkbox" id="pa"> Start recording automatically at that time</label>
		<p class="help">If it's not starting automatically, I'll pop up a "Start recording?" reminder ${S.store.page.recordLeadMin} minutes before.</p>
		<div class="btns"><button class="primary" id="pset">Set</button><button id="pskip">Skip (stay stopped)</button></div>`, (b) => {
		$('#pskip', b).onclick = () => { cmd({ cmd: 'recordPlan', nextStart: null }); closeDialog() }
		$('#pset', b).onclick = () => {
			const t = $('#pt', b).value
			if (!t) return flash('Pick a time first, or press Skip')
			const when = new Date(`${$('#pd', b).value}T${t}:00`)
			cmd({ cmd: 'recordPlan', nextStart: when.toISOString(), autoStart: $('#pa', b).checked })
			closeDialog()
		}
	})
}

// ---- pop-ups from the module ----
let noticeSig = ''
function renderNotices() {
	const sig = JSON.stringify(S.notices || [])
	if (sig === noticeSig) return
	noticeSig = sig
	const box = $('#notices')
	box.innerHTML = (S.notices || []).map((n) => {
		const big = n.kind === 'record-due'
		const btns = n.actions.map((a, i) => `<button class="${big && i === 0 ? 'primary go' : i === 0 ? 'primary' : ''}" data-n="${n.id}" data-a="${a.id}">${esc(a.label)}</button>`).join('')
		return `<div class="notice ${big ? 'big' : ''}"><h4>${esc(n.title)}</h4><p>${esc(n.message)}</p><div class="btns">${btns}</div></div>`
	}).join('')
	$$('[data-n]', box).forEach((b) => b.onclick = () => {
		if (b.dataset.a === 'newtime') { cmd({ cmd: 'notice', id: b.dataset.n, action: 'dismiss' }); planFlow('NEW START TIME') }
		else cmd({ cmd: 'notice', id: b.dataset.n, action: b.dataset.a })
	})
}

// ---- tip of the day ----
const TIPS = [
	'Input sounding lovely? Press "This level". Auto level keeps it there, and leaves it alone while it stays inside the band.',
	'On a Stream Deck, the auto gain button preset is three buttons in one: press = this level, double tap = calibrate to the input\'s level, press and hold = calibrate to the module level.',
	'For small moves, drag a fader with two fingers, or switch FINE on for the strip. Double tap a fader for 0 dB.',
	'Knobs go up and down, not round and round. Hold Shift for fine steps, double click to reset, click the value to type one.',
	'Solo lets you hear just one input on monitoring. Let go and every PFL goes back to how it was. It never touches the recording.',
	'Got a spare mic on the presenter? Make it the backup (Input section → Backup for). With auto switch on (Show advanced → Backup feed) it crossfades to the backup if the main drops out, and never switches back by itself.',
	'Stopping a recording asks twice (no accidents here), then asks when it\'s due to restart. Set a time and a countdown appears in the top bar.',
	'Settings float. Drag them by the title bar out of the way and carry on with the strips.',
	'Drag a strip\'s right edge to make it wider. Tick Match widths to size them all together.',
	'Show advanced opens every auto gain setting over the channel settings. Pin it to keep it as its own column.',
	'Moving to another machine? Export your settings from Settings → Export / import. On import you choose which parts to take, and the old settings are kept as an autosave.',
	'Hover over anything for a tooltip. Know it all already? Turn them off in Settings → Page.',
	'With auto level moving the fader, a Grid fader latched to that input lets go each time. Ride the trim instead and you keep both.',
	'The PRE meter is before the fader. POST is what goes out.',
	'Got more than one rig? SOURCES pulls strips in from other OBS Audio and ATEM Audio pages on the network. Grouped by source, or drag them anywhere you like.',
	'Recordings can be named from a spreadsheet: Settings → Recordings → Sheet source. Step to the next session with NEXT, or let the clock pick the row.',
	'Recordings tab: play, download, rename or bin any recording, straight from the page.',
]
const allTips = () => [...TIPS, ...((META && META.tips) || [])]
let tipN = LS('tipN', 0)
function showTip() {
	const T = allTips()
	$('#tipText').textContent = T[tipN % T.length]
	$('#tipOnOpen').checked = S.store.page.tipsOnOpen
	$('#tip').classList.add('open')
}
$('#bTips').onclick = () => { tipN++; LSset('tipN', tipN); showTip() }
$('#tipNext').onclick = () => { tipN++; LSset('tipN', tipN); showTip() }
$('#tipClose').onclick = () => $('#tip').classList.remove('open')
$('#tipOnOpen').onchange = (e) => cmd({ cmd: 'page', key: 'tipsOnOpen', value: e.target.checked })
function firstOpen() { if (S.store.page.tipsOnOpen) { tipN++; LSset('tipN', tipN); showTip() } }

// ---- knob ----
function knobSvg(value, min, max) {
	const f = Math.max(0, Math.min(1, (value - min) / (max - min)))
	const a = -135 + f * 270
	const pt = (ang, r) => { const t = ((ang - 90) * Math.PI) / 180; return [(20 + r * Math.cos(t)).toFixed(2), (20 + r * Math.sin(t)).toFixed(2)] }
	const arc = (from, to, r) => { const [x1, y1] = pt(from, r), [x2, y2] = pt(to, r); return `M${x1},${y1} A${r},${r} 0 ${to - from > 180 ? 1 : 0} 1 ${x2},${y2}` }
	const [px, py] = pt(a, 12)
	return `<svg viewBox="0 0 40 40"><path d="${arc(-135, 135, 16)}" stroke="#2a2340" stroke-width="4" fill="none"/>${f > 0.002 ? `<path d="${arc(-135, a, 16)}" stroke="#7a2fe0" stroke-width="4" fill="none"/>` : ''}<circle cx="20" cy="20" r="11" fill="#14101f" stroke="#3a2d57"/><line x1="20" y1="20" x2="${px}" y2="${py}" stroke="#b98cff" stroke-width="2.5"/></svg>`
}
function knob({ label, value, min, max, step = 1, def, unit = '', tip = '', key }) {
	const d = step < 1 ? (step < 0.1 ? 2 : 1) : 0
	return `<div class="knob" data-knob="${esc(key)}" data-min="${min}" data-max="${max}" data-step="${step}" data-def="${def ?? ''}" data-v="${value}" data-dec="${d}" data-unit="${esc(unit)}" data-tip="${esc(tip)}">${knobSvg(value, min, max)}<span class="kv">${Number(value).toFixed(d)}${unit ? ' ' + esc(unit) : ''}</span><span class="kl">${esc(label)}</span></div>`
}
function wireKnobs(root, onSet) {
	$$('[data-knob]', root).forEach((k) => {
		const min = +k.dataset.min, max = +k.dataset.max, step = +k.dataset.step, dec = +k.dataset.dec, unit = k.dataset.unit
		let v = +k.dataset.v
		const show = () => {
			const tmp = document.createElement('div')
			tmp.innerHTML = knobSvg(v, min, max)
			$('svg', k).replaceWith($('svg', tmp))
			$('.kv', k).textContent = v.toFixed(dec) + (unit ? ' ' + unit : '')
			bind()
		}
		const send = throttle(() => onSet(k.dataset.knob, v), 50)
		const setV = (nv) => { nv = Math.max(min, Math.min(max, Math.round(nv / step) * step)); if (Math.abs(nv - v) < step / 2) return; v = nv; k.dataset.v = v; show(); send() }
		const bind = () => {
			const svg = $('svg', k)
			svg.addEventListener('pointerdown', (e) => {
				e.preventDefault(); k.classList.add('active')
				let y = e.clientY, acc = v
				const mv = (ev) => { const dy = y - ev.clientY; y = ev.clientY; acc = Math.max(min, Math.min(max, acc + (dy * (max - min)) / (ev.shiftKey ? 1200 : 200))); setV(acc) }
				const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); k.classList.remove('active') }
				addEventListener('pointermove', mv); addEventListener('pointerup', up)
			})
			svg.addEventListener('wheel', (e) => { e.preventDefault(); setV(v + (e.deltaY < 0 ? step : -step) * (e.shiftKey ? 1 : 5)) }, { passive: false })
			svg.addEventListener('dblclick', () => { if (k.dataset.def !== '') setV(+k.dataset.def) })
		}
		bind()
		$('.kv', k).addEventListener('click', () => { const t = prompt(`${$('.kl', k).textContent} (${min} to ${max})`, String(v)); if (t !== null && t.trim() !== '' && !isNaN(+t)) setV(+t) })
	})
}

// ---- rendering ----
function sectionMode(inp, sec) { return inp.sections[sec.id] || sec.mode }

/** Blocks on this input that report gain reduction, shown as GR meters */
function grKinds(X, inp) { const gk = new Set(X.META.processing.filter((k) => k.gainReduction).map((k) => k.kind)); return inp.blocks.filter((b) => gk.has(b.kind)).map((b) => b.id) }

function buildStrip(X, inp, rows) {
	const st = ps(skey(X, inp.id))
	const pre = !!inp.caps.preMeter && (st.pre ?? PG().showPre), post = st.post ?? PG().showPost
	const el = document.createElement('div')
	el.className = 'strip' + (st.pinned ? ' pinned' : '')
	el.dataset.id = inp.id
	el.dataset.key = skey(X, inp.id)
	const meterHtml = (cls, label) => `<div class="meter ${cls}" data-tip="${cls === 'pre' ? 'PRE: what\'s coming in, before the fader (peaks)' : 'POST: the level after the fader, as recorded'}"><span class="mlbl">${label}</span>${Array.from({ length: Math.max(1, Math.min(inp.channels, 8)) }, () => `<div class="ch"><div class="bar"></div><div class="pk"></div></div>`).join('')}<div class="band"></div><div class="tgt"></div></div>`
	el.innerHTML = `<div class="name"></div>
		<div class="cols">
			<div class="col fmcol">
				<div class="tog">${!inp.caps.preMeter ? '' : `<button class="${pre ? 'on' : ''}" data-t="pre" data-tip="Shows the pre-fader meter on this strip">PRE</button>`}<button class="${post ? 'on' : ''}" data-t="post" data-tip="Shows the post-fader meter on this strip">POST</button><button class="${st.fine ? 'on' : ''}" data-t="fine" data-tip="Fine: small fader moves on this strip (two fingers do the same trick)">FINE</button></div>
				<div class="fm${PG().meterScaleSide === 'left' ? ' msl' : ''}"><div class="meters">${pre ? meterHtml('pre', 'PRE') : ''}${post ? meterHtml('post', 'POST') : ''}${grKinds(X, inp).map((b) => `<div class="meter gr" data-gr="${esc(b)}" data-tip="Gain reduction: ${esc(b)}"><span class="mlbl">GR</span><div class="ch"><div class="bar"></div></div></div>`).join('')}</div>${pre || post ? `<div class="mscale" data-tip="Meter scale (dB)">${[0, -6, -12, -18, -24, -36, -48].filter((d) => d <= PG().meterTopDb && d > PG().meterFloorDb).map((d) => `<span style="bottom:${mFrac(d) * 100}%">${d}</span>`).join('')}</div>` : ''}<div class="fader${PG().faderScaleSide === 'right' ? ' sr' : ''}" style="--cap:${esc(PG().capColour)};--capline:${esc(PG().capLineColour)}" data-tip="The fader. Drag to move; double tap for 0 dB."><div class="track"></div><div class="scale"></div><div class="cap"></div></div></div>
				<div class="readout"><span class="val vol"></span><span class="rstate"></span><span class="val lvl" data-tip="The level auto level is listening to right now"></span></div>
				<div class="bottom">${inp.caps.mute ? '<button class="mute" data-a="mute" data-tip="Mute: cuts this input from the output and the recording">MUTE</button>' : '<span></span>'}${inp.caps.monitor ? `<button class="pfl" data-a="pfl" data-tip="PFL: have a listen to this input on ${esc(X.META.device.label)}'s monitoring (headphones). The output and recording don't change.">PFL</button><button class="solo" data-a="solo" data-tip="Solo: hear only this input on monitoring while held (or until pressed again with Solo latch on). Never touches the output or the recording.">SOLO</button>` : ''}</div>
			</div>
			<div class="col setcol"><div class="basic"></div><div class="sections"></div><div class="adv"></div></div>
			<div class="col advcol"><div class="adv"></div></div>
		</div><div class="grip" data-tip="Drag to make this strip wider or narrower"></div>`
	for (const bar of $$('.meter.pre .bar, .meter.post .bar', el)) bar.style.background = zoneGradient(rows)
	if (PG().meterPaleBack) for (const ch of $$('.meter.pre .ch, .meter.post .ch', el)) { ch.classList.add('pale'); ch.style.backgroundImage = zoneGradient(rows, PG().meterPaleStrength) }
	const scale = $('.scale', el)
	for (const db of [10, 5, 0, -5, -10, -20, -30, -40, -60]) {
		if (db > PG().faderTopDb) continue
		const p = dbToPos(db)
		const t = document.createElement('div')
		t.className = 'tick' + (db === 0 ? ' u' : '')
		if (rows) t.style.left = p * 100 + '%'; else t.style.top = (1 - p) * 100 + '%'
		t.innerHTML = `<span>${db > 0 ? '+' + db : db}</span>`
		scale.appendChild(t)
	}
	attachFader(X, $('.fader', el), inp.id, rows)
	$$('.tog button', el).forEach((b) => b.onclick = () => {
		const s = ps(skey(X, inp.id)), k = b.dataset.t
		if (k === 'fine') s.fine = !s.fine
		else s[k] = !((s[k] ?? PG()[k === 'pre' ? 'showPre' : 'showPost']))
		savePs(); render()
	})
	const name = inp.id
	const cur = () => X.S.inputs.find((i) => i.id === name)
	if ($('.bottom [data-a=mute]', el)) $('.bottom [data-a=mute]', el).onclick = () => X.cmd({ cmd: 'mute', input: name, value: !cur().muted })
	if ($('[data-a=pfl]', el)) $('[data-a=pfl]', el).onclick = () => X.cmd({ cmd: 'pfl', input: name, value: !cur().pfl })
	const solo = $('[data-a=solo]', el) || document.createElement('button')
	let holding = false
	solo.addEventListener('pointerdown', (e) => { if (PG().soloLatch) return; e.preventDefault(); holding = true; solo.setPointerCapture(e.pointerId); X.cmd({ cmd: 'solo', input: name, value: true }) })
	const soloUp = () => { if (holding) { holding = false; X.cmd({ cmd: 'solo', input: name, value: false }) } }
	solo.addEventListener('pointerup', soloUp)
	solo.addEventListener('pointercancel', soloUp)
	solo.addEventListener('click', () => { if (PG().soloLatch) X.cmd({ cmd: 'solo', input: name, value: X.S.solo !== name }) })
	el.addEventListener('click', (e) => {
		const h = e.target.closest('.sec.collapsible h3')
		if (!h) return
		const sec = h.parentElement
		sec.classList.toggle('collapsed')
		collapsed[ckey(X, name) + '/' + sec.dataset.id] = sec.classList.contains('collapsed')
		LSset('collapsed', collapsed)
	})
	const grip = $('.grip', el)
	grip.addEventListener('pointerdown', (e) => {
		e.preventDefault(); grip.classList.add('drag')
		const me = skey(X, name)
		const x0 = e.clientX, w0 = el.offsetWidth - (ps(me).pinned ? 260 : 0)
		const mv = (ev) => {
			const w = Math.max(200, Math.min(1000, w0 + ev.clientX - x0))
			const targets = LS('match', false) ? [...strips.keys()] : [me]
			for (const n of targets) { ps(n).width = w; const s = strips.get(n); if (s) s.el.style.width = w + (ps(n).pinned ? 260 : 0) + 'px' }
		}
		const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); grip.classList.remove('drag'); savePs() }
		addEventListener('pointermove', mv); addEventListener('pointerup', up)
	})
	return el
}

function editing(el) { const ae = document.activeElement; return !!ae && el.contains(ae) && ae.matches('input[type=text], input[type=number], input[type=time], input[type=date], select, textarea') }

function updateStrip(X, s, inp) {
	const el = s.el
	const rows = PG().layout === 'rows'
	const busy = editing(el) || el.querySelector('.knob.active')
	const nameOf = (id) => (X.S.inputs.find((i) => i.id === id) || { name: id }).name
	const role = inp.caps.role ? inp.caps.role.toUpperCase() : ''
	const tag = inp.onBackup ? 'ON BACKUP' : inp.backupFor ? `BACKUP OF ${nameOf(inp.backupFor)}` : role
	const srcTag = joined() && layoutMode() === 'free' ? `<span class="src" data-tip="From ${esc(X.name)}">${esc(X.name)}</span>` : ''
	const nameHtml = `<span class="drag" data-tip="Drag to move this strip anywhere">⠿</span><span class="nm" data-tip="${esc(inp.name)}">${esc(inp.name)}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ''}${srcTag}`
	if ($('.name', el).innerHTML !== nameHtml) $('.name', el).innerHTML = nameHtml
	const sig = JSON.stringify([inp.blocks, inp.overrides, inp.sections, inp.settings, inp.routing, inp.balance, inp.delay, inp.mixOption, inp.monitor, inp.hasTrim, inp.trimDb, inp.target, inp.backupFor, inp.onBackup, X.S.store.sections, X.S.store.defaults, X.S.store.moduleCalibrateDb, X.S.inputs.map((i) => i.id + '\u0001' + i.name)])
	if (sig !== s.sig && !busy) {
		s.sig = sig
		$('.basic', el).innerHTML = basicHtml(X, inp)
		$('.sections', el).innerHTML = X.S.store.sections
			.filter((sec) => sectionMode(inp, sec) !== 'hidden' && sec.controls.length)
			.map((sec) => {
				const mode = sectionMode(inp, sec)
				const isCol = mode === 'collapsible' && (collapsed[ckey(X, inp.name) + '/' + sec.id] ?? true)
				const pc = inp.caps.processing
				const kinds = pc && pc.addable ? X.META.processing.filter((k) => sec.controls.includes(k.kind) && pc.kinds.includes(k.kind)) : []
				const add = kinds.length ? `<select class="addf" data-a="fadd" data-tip="Add processing to this input"><option value="">+ Add…</option>${kinds.map((k) => `<option value="${k.kind}">${esc(k.label)}</option>`).join('')}</select>` : ''
				const body = sec.controls.map((c) => control(X, inp, c)).join('') + add
				return body ? `<div class="sec ${mode === 'collapsible' ? 'collapsible' : ''} ${isCol ? 'collapsed' : ''}" data-id="${esc(sec.id)}"><h3>${esc(sec.name)}</h3><div class="body">${body}</div></div>` : ''
			}).join('')
		const advHtml = advancedHtml(X, inp)
		for (const a of $$('.adv', el)) { const open = a.classList.contains('open'); a.innerHTML = advHtml; a.classList.toggle('open', open) }
		wire(X, el, inp.id)
	}
	if (!dragging.has(skey(X, inp.id))) setCap(el, dbToPos(inp.volumeDb), rows)
	$('.vol', el).textContent = fmt(inp.volumeDb) + ' dB'
	const rs = $('.rstate', el)
	rs.className = 'rstate ' + inp.autoLevel
	rs.textContent = inp.autoLevel === 'off' ? (inp.settings.autoLevelOn ? 'no target' : '') : inp.autoLevel
	for (const b of $$('[data-a=mute]', el)) b.classList.toggle('on', inp.muted)
	for (const b of $$('[data-a=pfl]', el)) b.classList.toggle('on', !!inp.pfl)
	for (const b of $$('[data-a=solo]', el)) b.classList.toggle('on', X.S.solo === inp.id)
	$('.fader', el).classList.toggle('fine', !!ps(skey(X, inp.id)).fine)
	for (const t of $$('[data-live=state]', el)) t.textContent = inp.autoLevel
	for (const t of $$('[data-live=target]', el)) t.textContent = inp.target === null ? 'none' : fmt(inp.target) + ' dB'
	const p = PG()
	for (const m of $$('.meter.pre, .meter.post', el)) { $('.band', m).style.display = 'none'; $('.tgt', m).style.display = 'none' }
	const meter = $(inp.settings.controlMode === 'trim' && inp.caps.trim ? '.meter.pre' : '.meter.post', el)
	if (meter && inp.target !== null) {
		const band = $('.band', meter), tgt = $('.tgt', meter)
		const lo = mFrac(inp.target - inp.settings.bandDb), hi = mFrac(inp.target + inp.settings.bandDb), t = mFrac(inp.target)
		band.style.display = tgt.style.display = ''
		band.style.background = inp.autoLevel === 'riding' ? p.ridingColour : p.bandColour
		tgt.style.background = p.targetColour
		if (rows) { const w = meter.clientWidth - 20; band.style.left = 10 + lo * w + 'px'; band.style.width = (hi - lo) * w + 'px'; tgt.style.left = 10 + t * w - 1 + 'px' }
		else { const h = meter.clientHeight - 20; band.style.bottom = 10 + lo * h + 'px'; band.style.height = (hi - lo) * h + 'px'; tgt.style.bottom = 10 + t * h - 1 + 'px' }
	}
}

function setCap(el, pos, rows) {
	const cap = $('.cap', el)
	if (rows) cap.style.left = `calc(10px + (100% - 20px) * ${pos})`
	else cap.style.top = `calc(10px + (100% - 20px) * ${1 - pos})`
}

// basic auto gain, at the top of the channel settings
function basicHtml(X, inp) {
	const on = inp.settings.autoLevelOn
	return `<div class="btns"><button class="${on ? 'on' : ''}" data-a="autolevel" data-tip="Auto level on/off: keeps this input near its target by moving the ${inp.settings.controlMode === 'trim' && inp.caps.trim ? 'trim' : 'fader'} for you, so you don\'t have to">AUTO LEVEL ${on ? 'ON' : 'OFF'}</button><button data-a="capture" data-tip="This level please: sounds right? This grabs the level now as the target">THIS LEVEL</button><button data-a="cal" data-l="input" data-tip="Calibrate this input once, to its own level (${fmt(inp.settings.calibrateDb, 1)} dB)">CAL ${fmt(inp.settings.calibrateDb, 0)}</button><button data-a="cal" data-l="module" data-tip="Calibrate once, to the module level (${fmt(X.S.store.moduleCalibrateDb, 1)} dB)">CAL ${fmt(X.S.store.moduleCalibrateDb, 0)}</button></div>
		<div class="stat"><span class="lbl">Target</span><span class="val" data-live="target" data-tip="The level auto level holds. Click to type your own." style="cursor:text">${inp.target === null ? 'none' : fmt(inp.target) + ' dB'}</span></div>
		<div class="stat" data-tip="${esc(X.META.inputFields.bandDb.help)}"><span class="lbl">Leave alone within ±</span><span style="white-space:nowrap"><input type="number" data-a="band" value="${inp.settings.bandDb}" min="0" max="30" step="0.5" style="width:56px"> dB</span></div>
		<div class="stat"><span class="lbl">Status</span><span class="val" data-live="state">${inp.autoLevel}</span></div>
		<button data-a="adv" data-tip="Shows every auto gain and backup setting for this input. All the knobs.">SHOW ADVANCED ▸</button>`
}

function control(X, inp, c) {
	const k = inp.caps
	switch (c) {
		case 'mute': return k.mute ? `<div class="btns"><button class="mute ${inp.muted ? 'on' : ''}" data-a="mute" data-tip="Mute: cuts this input from the output and recording">${inp.muted ? 'MUTED' : 'MUTE'}</button></div>` : ''
		case 'monitor': return k.monitor ? `<div class="row"><span class="lbl" data-tip="What monitoring does with this input">Monitor</span><select data-a="monitor">${k.monitor.choices.map((o) => `<option value="${esc(o.id)}" ${inp.monitor === o.id ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></div>` : ''
		case 'balance': return k.balance ? `<div class="knobs">${knob({ label: 'Balance', value: Math.round((inp.balance - 0.5) * 200), min: -100, max: 100, step: 1, def: 0, key: 'balance', tip: 'Balance: -100 = left, 0 = centre, 100 = right. Double click to centre.' })}</div>` : ''
		case 'delay': return k.delay ? `<div class="row"><span class="lbl" data-tip="Delays this input so it lines up with the video">${esc(k.delay.label)} (${esc(k.delay.unit)})</span><input type="number" data-a="delay" value="${inp.delay}" min="${k.delay.min}" max="${k.delay.max}" step="${k.delay.step}"></div>` : ''
		case 'trim': return k.trim ? `<div class="knobs">${knob({ label: k.trim.label + (inp.hasTrim ? '' : ' (adds)'), value: inp.trimDb, min: k.trim.minDb, max: k.trim.maxDb, step: 0.1, def: 0, unit: 'dB', key: 'trim', tip: `${k.trim.label}: the gain before the fader. Double click for 0 dB.` })}</div>` : ''
		case 'mixOption': return k.mixOption ? `<div class="row"><span class="lbl" data-tip="${esc(k.mixOption.label)}">${esc(k.mixOption.label)}</span><select data-a="mixOption">${k.mixOption.choices.map((o) => `<option value="${esc(o.id)}" ${inp.mixOption === o.id ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></div>` : ''
		case 'routing': return k.routing ? `<div class="tracks" style="grid-template-columns: repeat(${Math.max(1, Math.min(8, k.routing.targets.length))}, 1fr)">${k.routing.targets.map((t) => `<button class="${inp.routing[t.id] ? 'on' : ''}" data-a="route" data-t="${esc(t.id)}" data-tip="${esc(k.routing.label)}: ${esc(t.label)}">${esc(t.label)}</button>`).join('')}</div>` : ''
		case 'backup': {
			if (k.role) return ''
			const others = X.S.inputs.filter((i) => i.id !== inp.id && !i.caps.role)
			const sw = inp.backupFor ? `<button class="${inp.onBackup ? 'on' : ''}" data-a="bswitch" data-tip="Switch between the main and this backup, with a crossfade">${inp.onBackup ? 'ON BACKUP: BACK TO MAIN' : 'SWITCH TO BACKUP'}</button>` : ''
			return `<div class="row" data-tip="${esc(X.META.inputFields.backupOf.help)}"><span class="lbl">Backup for</span><select data-a="sset" data-key="backupOf"><option value="">none</option>${others.map((o) => `<option value="${esc(o.id)}" ${inp.settings.backupOf === o.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select></div>${sw}`
		}
		default: {
			const kind = X.META.processing.find((x) => x.kind === c)
			if (!kind || !k.processing || !k.processing.kinds.includes(c)) return ''
			return inp.blocks.filter((b) => b.kind === c && !b.isTrim).map((b) => blockBox(b, kind, k.processing.addable)).join('')
		}
	}
}

/** One processing block: knobs for numbers, drop-downs for choices, all from the device's table */
function blockBox(f, kind, removable) {
	const bid = esc(f.id)
	const knobs = kind.params.filter((p) => p.type === 'number').map((p) => knob({ label: p.label, value: Number(f.settings[p.key] ?? p.default), min: p.min, max: p.max, step: p.step, def: p.default, unit: p.unit || '', key: `${f.id}\u0001${p.key}`, tip: `${kind.label}: ${p.label}${p.unit ? ' (' + p.unit + ')' : ''}. Double click for the default (${p.default}).` })).join('')
	const others = kind.params.filter((p) => p.type !== 'number').map((p) => {
		const v = f.settings[p.key] ?? p.default
		if (p.type === 'choice') return `<div class="row"><span class="lbl">${esc(p.label)}</span><select data-a="bset" data-b="${bid}" data-key="${p.key}">${p.choices.map((c) => `<option value="${esc(c.id)}" ${String(v) === c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select></div>`
		if (p.type === 'bool') return `<div class="row"><span class="lbl">${esc(p.label)}</span><select data-a="bset" data-b="${bid}" data-key="${p.key}" data-bool="1"><option value="true" ${v ? 'selected' : ''}>On</option><option value="false" ${!v ? 'selected' : ''}>Off</option></select></div>`
		return `<div class="row"><span class="lbl">${esc(p.label)}</span><input type="text" data-a="bset" data-b="${bid}" data-key="${p.key}" value="${esc(v)}"></div>`
	}).join('')
	const name = esc(f.name)
	return `<div class="filter ${f.enabled ? '' : 'off'}"><div class="fhead"><span data-tip="${name}">${name}</span><button class="small ${f.enabled ? 'on' : ''}" data-a="bon" data-b="${bid}" data-tip="Switches this on or off">${f.enabled ? 'ON' : 'OFF'}</button>${removable ? `<button class="small" data-a="bdel" data-b="${bid}" data-tip="Removes this from the input">✕</button>` : ''}</div>${others}<div class="knobs">${knobs}</div></div>`
}

function fieldInput(X, key, field, value, attrs) {
	if (field.type === 'bool') return `<select ${attrs}><option value="true" ${value ? 'selected' : ''}>On</option><option value="false" ${!value ? 'selected' : ''}>Off</option></select>`
	if (field.type === 'choice') return `<select ${attrs}>${field.choices.map((c) => `<option value="${c.id}" ${value === c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select>`
	if (field.type === 'input') return `<select ${attrs}><option value="">none</option>${(X.S.inputs || []).map((i) => `<option value="${esc(i.id)}" ${value === i.id ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}</select>`
	if (field.type === 'text') return `<input type="text" ${attrs} value="${esc(value)}">`
	return `<input type="number" ${attrs} value="${value}" min="${field.min}" max="${field.max}" step="${field.step}">`
}

const GROUP_TITLES = { autolevel: 'Auto level', capture: 'This level please', limits: 'Limits', quiet: 'When it goes quiet', calibrate: 'Calibrate', backup: 'Backup feed' }
/** Setting groups in order: the core's, then any the device adds */
function groups(X) { const g = Object.keys(GROUP_TITLES); for (const f of Object.values(X.META.inputFields)) if (!g.includes(f.group)) g.push(f.group); return g.map((id) => [id, GROUP_TITLES[id] || id]) }
function advancedHtml(X, inp) {
	const body = groups(X).filter(([g]) => !(inp.caps.role && g === 'backup')).map(([g, title]) => `<h4>${title}</h4>` + Object.entries(X.META.inputFields).filter(([, f]) => f.group === g).map(([k, f]) => {
		const ovr = k in inp.overrides
		return `<div class="row" data-tip="${esc(f.help || '')}"><span class="lbl ${ovr ? 'ovr' : ''}">${esc(f.label)}${f.unit ? ' (' + esc(f.unit) + ')' : ''}</span>${ovr ? `<button class="reset" data-a="sreset" data-key="${k}" data-tip="Changed for this input. Press to put it back to the default.">↺</button>` : ''}${fieldInput(X, k, f, inp.settings[k], `data-a="sset" data-key="${k}"`)}</div>`
	}).join('')).join('')
	return `<div class="ahead"><b>AUTO GAIN · ${esc(inp.name)}</b><button class="small" data-a="pin" data-tip="Pin: keeps these settings in their own column instead of over the channel settings">${ps(skey(X, inp.id)).pinned ? 'UNPIN' : 'PIN'}</button><button class="small" data-a="advclose" data-tip="Close">✕</button></div><div class="abody">${body}<p class="help">Purple means changed for this input; ↺ puts it back to the default (Settings → Auto gain defaults).</p></div>`
}

function wire(X, el, name) {
	const me = skey(X, name)
	const on = (sel, ev, fn) => $$(sel, el).forEach((x) => x.addEventListener(ev, (e) => fn(x, e)))
	const inp = () => X.S.inputs.find((i) => i.id === name)
	on('.sections [data-a=mute]', 'click', () => X.cmd({ cmd: 'mute', input: name, value: !inp().muted }))
	on('[data-a=monitor]', 'change', (x) => X.cmd({ cmd: 'monitor', input: name, value: x.value }))
	on('[data-a=mixOption]', 'change', (x) => X.cmd({ cmd: 'mixOption', input: name, value: x.value }))
	on('[data-a=delay]', 'change', (x) => X.cmd({ cmd: 'delay', input: name, value: +x.value }))
	on('[data-a=route]', 'click', (x) => X.cmd({ cmd: 'routing', input: name, target: x.dataset.t, value: !inp().routing[x.dataset.t] }))
	on('[data-a=autolevel]', 'click', () => X.cmd({ cmd: 'autoLevel', input: name, value: !inp().settings.autoLevelOn }))
	on('[data-a=capture]', 'click', () => X.cmd({ cmd: 'capture', input: name }))
	on('[data-a=cal]', 'click', (x) => X.cmd({ cmd: 'calibrate', input: name, level: x.dataset.l }))
	on('[data-a=band]', 'change', (x) => X.cmd({ cmd: 'inputSetting', input: name, key: 'bandDb', value: x.value }))
	on('[data-live=target]', 'click', () => { const t = prompt('Target level (dB), blank to clear', inp().target ?? ''); if (t !== null) X.cmd({ cmd: 'setTarget', input: name, value: t }) })
	on('[data-a=bswitch]', 'click', () => X.cmd({ cmd: 'backupSwitch', input: name, to: inp().onBackup ? 'main' : 'backup' }))
	on('[data-a=fadd]', 'change', (x) => { if (x.value) X.cmd({ cmd: 'blockAdd', input: name, kind: x.value }); x.value = '' })
	on('[data-a=bdel]', 'click', (x) => { if (confirm(`Remove ${x.dataset.b} from this input?`)) X.cmd({ cmd: 'blockRemove', input: name, block: x.dataset.b }) })
	on('[data-a=bon]', 'click', (x) => X.cmd({ cmd: 'blockEnable', input: name, block: x.dataset.b, value: !x.classList.contains('on') }))
	on('[data-a=bset]', 'change', (x) => X.cmd({ cmd: 'blockSet', input: name, block: x.dataset.b, key: x.dataset.key, value: x.dataset.bool ? x.value === 'true' : x.value }))
	on('[data-a=sset]', 'change', (x) => X.cmd({ cmd: 'inputSetting', input: name, key: x.dataset.key, value: x.value }))
	on('[data-a=sreset]', 'click', (x) => X.cmd({ cmd: 'inputSetting', input: name, key: x.dataset.key, value: null }))
	on('[data-a=adv]', 'click', () => { if (!ps(me).pinned) $('.setcol .adv', el).classList.add('open') })
	on('[data-a=advclose]', 'click', () => { if (ps(me).pinned) { ps(me).pinned = false; savePs(); render() } else $$('.adv', el).forEach((a) => a.classList.remove('open')) })
	on('[data-a=pin]', 'click', () => { ps(me).pinned = !ps(me).pinned; savePs(); render() })
	wireKnobs(el, (key, v) => {
		if (key === 'balance') X.cmd({ cmd: 'balance', input: name, value: (v + 100) / 200 })
		else if (key === 'trim') X.cmd({ cmd: 'trim', input: name, value: v })
		else { const [b, k] = key.split('\u0001'); X.cmd({ cmd: 'blockSet', input: name, block: b, key: k, value: v }) }
	})
}

function throttle(fn, ms = 40) {
	let last = 0, timer = null, args = null
	return (...a) => {
		args = a
		const now = Date.now()
		if (now - last >= ms) { last = now; fn(...args) }
		else if (!timer) timer = setTimeout(() => { timer = null; last = Date.now(); fn(...args) }, ms - (now - last))
	}
}

// ---- the fader ----
function attachFader(X, f, name, rows) {
	const me = skey(X, name)
	const pointers = new Map()
	let startPos = 0, startCoord = 0, lastTap = 0, moved = false
	const send = throttle((db) => X.cmd({ cmd: 'volume', input: name, db }), 33)
	const coord = (e) => (rows ? e.clientX : -e.clientY)
	const len = () => (rows ? f.clientWidth : f.clientHeight) - 20
	const strip = () => f.closest('.strip')
	f.addEventListener('pointerdown', (e) => {
		e.preventDefault()
		f.setPointerCapture(e.pointerId)
		pointers.set(e.pointerId, coord(e))
		if (pointers.size > 1) { f.classList.add('fine'); return }
		const inp = X.S.inputs.find((i) => i.id === name)
		const now = Date.now()
		if (PG().doubleTapUnity && now - lastTap < 300) {
			lastTap = 0
			setCap(strip(), dbToPos(0), rows)
			X.cmd({ cmd: 'volume', input: name, db: 0 })
			return
		}
		lastTap = now
		moved = false
		dragging.add(me)
		startPos = dbToPos(inp.volumeDb)
		startCoord = coord(e)
		X.cmd({ cmd: 'touch', input: name, value: true })
	})
	f.addEventListener('pointermove', (e) => {
		if (!pointers.has(e.pointerId) || !dragging.has(me)) return
		const c = coord(e)
		const isFine = !!ps(me).fine || pointers.size > 1
		f.classList.toggle('fine', isFine)
		if (Math.abs(c - startCoord) > 3) moved = true
		const pos = Math.max(0, Math.min(1, startPos + ((c - startCoord) / len()) * (isFine ? PG().fineRatio : 1)))
		startPos = pos
		startCoord = c
		setCap(strip(), pos, rows)
		const db = posToDb(pos)
		send(db === null ? null : Math.round(db * 10) / 10)
	})
	const end = (e) => {
		pointers.delete(e.pointerId)
		if (pointers.size) return
		f.classList.toggle('fine', !!ps(me).fine)
		if (dragging.has(me)) { dragging.delete(me); X.cmd({ cmd: 'touch', input: name, value: false }) }
		if (moved) lastTap = 0
	}
	f.addEventListener('pointerup', end)
	f.addEventListener('pointercancel', end)
}

// ---- meters ----
function drawMeters(X, frame) {
	if (!X.S || !PG()) return
	const p = PG()
	const now = Date.now()
	const rows = p.layout === 'rows'
	for (const [key, s] of strips) {
		if (s.X !== X) continue
		const name = s.id
		const m = frame[name]
		if (!m) continue
		const [post, pre, level, , gr] = m
		const pk = (peaks[key] ??= { post: [], pre: [] })
		const draw = (cls, vals, hold) => {
			const meter = $('.meter.' + cls, s.el)
			if (!meter) return
			$$('.ch', meter).forEach((ch, i) => {
				const v = vals[i] ?? vals[0] ?? null
				const f = mFrac(v)
				const bar = ch.firstChild
				bar.style.clipPath = rows ? `inset(0 ${(1 - f) * 100}% 0 0)` : `inset(${(1 - f) * 100}% 0 0 0)`
				const h = (hold[i] ??= { v: -999, t: 0 })
				const fv = v === null ? -999 : v
				if (fv >= h.v) { h.v = fv; h.t = now }
				else if (now - h.t > p.peakHoldMs) h.v = Math.max(fv, h.v - (p.peakFallDbPerS * (now - (h.last || now))) / 1000)
				h.last = now
				const pf = mFrac(h.v < -900 ? null : h.v)
				const pkEl = ch.lastChild
				if (rows) pkEl.style.left = `calc(${pf * 100}% - 2px)`; else pkEl.style.bottom = `calc(${pf * 100}% - 2px)`
				pkEl.style.display = pf > 0 ? '' : 'none'
			})
		}
		draw('post', post, pk.post)
		draw('pre', pre, pk.pre)
		for (const g of $$('.meter.gr', s.el)) {
			const v = Math.max(0, Math.min(20, (gr || {})[g.dataset.gr] || 0))
			const bar = $('.bar', g)
			if (rows) { bar.style.height = '100%'; bar.style.width = (v / 20) * 100 + '%' } else bar.style.height = (v / 20) * 100 + '%'
		}
		const lv = $('.lvl', s.el)
		if (lv) lv.textContent = level === null ? '' : fmt(level)
	}
}


// ---- sources: this page's own connection, plus any joined from other pages ----
// Each source is one connection's web server (OBS Audio, ATEM Audio...: same API). The page opens each one's live
// feed directly (CORS), and every control on a strip goes to the strip's own source.
const COLOURS = ['#7a2fe0', '#22b5c9', '#e0a02f', '#3fbf6a', '#e0507a', '#8a8fff', '#c96f22', '#5ad1a6']
const pins = LS('pins', {}) // source address -> PIN (forgotten as soon as it's turned down)
let srcCfg = LS('sources', []) // [{url, colour, on, manual, name}]
let groupOrder = LS('groupOrder', [])
const groupCollapsed = LS('groupCollapsed', {})
let freeOrder = LS('freeOrder', [])
const groupEls = new Map()
const sources = new Map() // key -> source
let movingStrip = null
let peerList = { peers: [], finder: true }

function normUrl(t) {
	let u = String(t || '').trim()
	if (!u) return ''
	if (!/^https?:\/\//i.test(u)) u = 'http://' + u
	try { const x = new URL(u); return `${x.protocol}//${x.host}` } catch { return '' }
}
const PG = () => (HOME.S ? HOME.S.store.page : null)
const layoutMode = () => LS('joinLayout', 'grouped')
const joined = () => [...sources.values()].some((x) => !x.home)
const skey = (X, id) => (X.home ? id : X.key + '|' + id)
const ckey = (X, name) => (X.home ? name : X.key + '|' + name)
function saveSources() { LSset('sources', srcCfg) }

function makeSource(cfg, home) {
	const X = { home, cfg, key: home ? 'home' : cfg.url, base: home ? '' : cfg.url, S: null, META: null, info: null, es: null, status: 'connecting', error: '', asking: false }
	X.pin = () => (home ? pin : pins[cfg.url] || '')
	X.q = (more = '') => { const p = X.pin(); const parts = [p ? 'pin=' + encodeURIComponent(p) : '', more].filter(Boolean); return parts.length ? '?' + parts.join('&') : '' }
	X.hdr = (extra = {}) => (X.pin() ? { ...extra, 'X-Rebel-Pin': X.pin() } : extra)
	Object.defineProperty(X, 'name', { get: () => (X.info && X.info.name) || cfg.name || (home ? '%APP_NAME%' : cfg.url.replace(/^https?:\/\//, '')) })
	Object.defineProperty(X, 'colour', { get: () => cfg.colour || COLOURS[0] })
	X.cmd = async (c) => {
		try {
			const r = await fetch(X.base + '/cmd', { method: 'POST', body: JSON.stringify(c), headers: X.hdr({ 'Content-Type': 'application/json' }) })
			if (r.status === 401) return pinRejected(X)
			const j = await r.json()
			if (!j.ok) flash((home ? '' : X.name + ': ') + (j.error || "That didn't work"))
			else if (j.message) flash(j.message)
			return j
		} catch { flash(home ? 'Lost touch with the module' : `Lost touch with ${X.name}`) }
	}
	X.get = async (path) => {
		const r = await fetch(X.base + path, { headers: X.hdr(), cache: 'no-store' })
		if (r.status === 401) { pinRejected(X); throw new Error('pin') }
		return r.json()
	}
	return X
}

function pinRejected(X) {
	if (X.home) return askPin()
	if (pins[X.cfg.url]) { delete pins[X.cfg.url]; LSset('pins', pins); X.error = "That PIN didn't work" }
	X.status = 'pin'
	if (X.es) { X.es.close(); X.es = null }
	render()
	askSourcePin(X)
}

function askSourcePin(X) {
	if (X.asking) return
	X.asking = true
	dialog('PIN NEEDED', `<h3>${esc(X.name)} has a PIN</h3><p class="help">${X.error ? esc(X.error) + '. ' : ''}Pop it in once and this browser remembers it (until it changes).</p>
		<input type="password" id="spin" autocomplete="off" style="width:100%"><div class="btns"><button class="primary" id="spinOk">Join</button><button id="spinNo">Not now</button></div>`, (b) => {
		const done = () => { X.asking = false; closeDialog() }
		$('#spinNo', b).onclick = done
		$('#spin', b).focus()
		const ok = () => { const v = $('#spin', b).value; if (!v) return; pins[X.cfg.url] = v; LSset('pins', pins); X.error = ''; done(); connectSource(X) }
		$('#spinOk', b).onclick = ok
		$('#spin', b).onkeydown = (e) => { if (e.key === 'Enter') ok() }
	})
	$('#dlgX').onclick = () => { X.asking = false; closeDialog(); $('#dlgX').onclick = closeDialog }
}

async function connectSource(X) {
	if (X.es) X.es.close()
	X.es = null
	X.status = 'connecting'
	if (!X.home) {
		try {
			const r = await fetch(X.base + '/api/info', { cache: 'no-store' })
			X.info = await r.json()
			if (HOME.info && X.info.id === HOME.info.id) { X.status = 'self'; X.error = "That's this page"; render(); return }
			if (X.info.name && X.cfg.name !== X.info.name) { X.cfg.name = X.info.name; saveSources() }
		} catch { X.status = 'down'; X.error = "Can't reach it"; render(); setTimeout(() => sources.has(X.key) && !X.es && connectSource(X), 8000); return }
		if (X.info.pin && !X.pin()) { X.status = 'pin'; render(); askSourcePin(X); return }
	}
	const es = new EventSource(X.base + '/events' + X.q())
	X.es = es
	es.addEventListener('meta', (e) => { X.META = JSON.parse(e.data); if (X.home) META = X.META })
	es.addEventListener('state', (e) => {
		const first = !X.S
		X.S = JSON.parse(e.data)
		X.status = 'ok'
		X.error = ''
		if (X.home) { S = X.S; if (first) firstOpen() }
		render()
		recStateChanged(X)
	})
	es.addEventListener('meters', (e) => drawMeters(X, JSON.parse(e.data)))
	es.onerror = async () => {
		if (X.home) $('#led').classList.remove('ok')
		X.status = 'connecting'
		try { const r = await fetch(X.base + '/api/peers', { headers: X.hdr(), cache: 'no-store' }); if (r.status === 401) { es.close(); pinRejected(X) } } catch { X.status = 'down'; X.error = 'Lost touch' }
		if (!X.home) renderGroups()
	}
}

const HOME = makeSource({ url: '' }, true)
sources.set('home', HOME)
function connect() { connectSource(HOME) }
function cmd(c) { return HOME.cmd(c) }
async function loadInfo() {
	try {
		HOME.info = await (await fetch('/api/info', { cache: 'no-store' })).json()
		HOME.cfg.colour = LS('homeColour', COLOURS[0])
	} catch {}
	for (const c of srcCfg) if (c.on) addSource(c)
	render()
}

function addSource(c) {
	if (sources.has(c.url)) return sources.get(c.url)
	const X = makeSource(c, false)
	sources.set(c.url, X)
	connectSource(X)
	return X
}
function dropSource(url) {
	const X = sources.get(url)
	if (!X) return
	if (X.es) X.es.close()
	sources.delete(url)
	for (const [k, s] of strips) if (s.X === X) { s.el.remove(); strips.delete(k) }
	const g = groupEls.get(url)
	if (g) { g.remove(); groupEls.delete(url) }
	render()
}
function nextColour() { const used = new Set([HOME.colour, ...srcCfg.map((c) => c.colour)]); return COLOURS.find((c) => !used.has(c)) || COLOURS[(srcCfg.length + 1) % COLOURS.length] }
function joinUrl(url, name, manual) {
	url = normUrl(url)
	if (!url) return flash("That doesn't look like an address")
	let c = srcCfg.find((x) => x.url === url)
	if (!c) { c = { url, colour: nextColour(), on: true, manual: !!manual, name: name || '' }; srcCfg.push(c) }
	c.on = true
	if (manual) c.manual = true
	saveSources()
	addSource(c)
	drawSources()
}
function unjoin(url, forget) {
	const c = srcCfg.find((x) => x.url === url)
	if (c) { if (forget || !c.manual) srcCfg = srcCfg.filter((x) => x !== c); else c.on = false }
	saveSources()
	dropSource(url)
	drawSources()
}

// ---- rendering all sources' strips: grouped by source, or in a free arrangement ----
function place(box, els) {
	let prev = null
	for (const el of els) {
		if (prev ? prev.nextSibling !== el : box.firstChild !== el) box.insertBefore(el, prev ? prev.nextSibling : box.firstChild)
		prev = el
	}
	while (prev && prev.nextSibling) prev.nextSibling.remove()
	if (!prev) box.innerHTML = ''
}

function orderedSources() {
	const all = [...sources.values()]
	const keys = groupOrder.filter((k) => sources.has(k))
	for (const X of all) if (!keys.includes(X.key)) keys.push(X.key)
	return keys.map((k) => sources.get(k))
}

function render() {
	if (!HOME.S || !HOME.META) return
	renderHeader()
	renderNotices()
	const rows = PG().layout === 'rows'
	const box = $('#strips')
	box.classList.toggle('rows', rows)
	const multi = joined()
	const mode = layoutMode()
	box.classList.toggle('grouped', multi && mode === 'grouped')
	box.classList.toggle('free', mode === 'free')
	const want = []
	for (const X of orderedSources()) {
		if (!X.S || !X.META) continue
		for (const inp of X.S.inputs.filter((i) => !i.hidden)) want.push({ X, inp, key: skey(X, inp.id) })
	}
	const keys = new Set(want.map((w) => w.key))
	for (const [k, s] of strips) if (!keys.has(k)) { s.el.remove(); strips.delete(k) }
	for (const { X, inp, key } of want) {
		let s = strips.get(key)
		const st = ps(key)
		const layoutSig = JSON.stringify([rows, st.pre ?? PG().showPre, st.post ?? PG().showPost, !!st.pinned, inp.channels, inp.caps, grKinds(X, inp), PG()])
		if (!s || s.layoutSig !== layoutSig) {
			const el = buildStrip(X, inp, rows)
			if (s) s.el.replaceWith(el)
			s = { el, sig: '', layoutSig, X, id: inp.id }
			strips.set(key, s)
		}
		s.el.classList.toggle('tagged', multi)
		s.el.style.setProperty('--gc', X.colour)
		if (!rows) s.el.style.width = (st.width || 340) + (st.pinned ? 260 : 0) + 'px'
		updateStrip(X, s, inp)
	}
	if (!movingStrip) {
		if (multi && mode === 'grouped') {
			const gl = orderedSources().map((X) => groupEl(X))
			for (const [k, g] of groupEls) if (!sources.has(k)) { g.remove(); groupEls.delete(k) }
			place(box, gl)
			for (const X of orderedSources()) place($('.gbody', groupEls.get(X.key)), want.filter((w) => w.X === X).map((w) => strips.get(w.key).el))
			renderGroups()
		} else {
			const order = freeOrder.filter((k) => keys.has(k))
			for (const w of want) if (!order.includes(w.key)) order.push(w.key)
			place(box, (mode === 'free' ? order : want.map((w) => w.key)).map((k) => strips.get(k).el))
		}
	}
	const any = want.length > 0
	$('#empty').style.display = any || (multi && mode === 'grouped') ? 'none' : ''
	$('#empty').textContent = HOME.S.connected ? `No audio inputs on ${HOME.META.device.label}` : (HOME.S.deviceError || `Waiting for ${HOME.META.device.label}…`)
	$('#srcCount').textContent = multi ? '· ' + sources.size : ''
	if ($('#settings').classList.contains('open')) renderSettings(false)
	if ($('#sources').classList.contains('open')) drawSourcesSoon()
}

function groupEl(X) {
	let g = groupEls.get(X.key)
	if (g) return g
	g = document.createElement('div')
	g.className = 'grp'
	g.dataset.key = X.key
	g.innerHTML = `<div class="ghead"><span class="swatch"></span><span class="led mini"></span><span class="gname"></span><span class="gsub"></span><span style="flex:1"></span>
		<button data-g="pin" style="display:none" data-tip="This source needs its PIN">PIN</button><button data-g="back" data-tip="Move this source's block earlier">◀</button><button data-g="fwd" data-tip="Move this source's block later">▶</button><button data-g="col" data-tip="Fold this source's block away (or open it again)">▾</button></div><div class="gbody"></div>`
	g.querySelector('.ghead').addEventListener('click', (e) => {
		const b = e.target.closest('[data-g]')
		if (!b) return
		const order = orderedSources().map((x) => x.key)
		const i = order.indexOf(X.key)
		if (b.dataset.g === 'col') { groupCollapsed[X.key] = !groupCollapsed[X.key]; LSset('groupCollapsed', groupCollapsed); renderGroups() }
		else if (b.dataset.g === 'pin') askSourcePin(X)
		else {
			const j = b.dataset.g === 'back' ? i - 1 : i + 1
			if (j < 0 || j >= order.length) return
			;[order[i], order[j]] = [order[j], order[i]]
			groupOrder = order
			LSset('groupOrder', groupOrder)
			render()
		}
	})
	groupEls.set(X.key, g)
	return g
}

function renderGroups() {
	for (const [k, g] of groupEls) {
		const X = sources.get(k)
		if (!X) continue
		g.style.setProperty('--gc', X.colour)
		g.classList.toggle('collapsed', !!groupCollapsed[k])
		$('.gname', g).textContent = X.name
		const dev = X.META ? X.META.app.name : X.info ? X.info.appName : ''
		$('.gsub', g).textContent = [dev, X.home ? 'this page' : X.cfg.url.replace(/^https?:\/\//, '')].filter(Boolean).join(' · ')
		$('.led', g).classList.toggle('ok', X.status === 'ok' && !!(X.S && X.S.connected))
		$('.led', g).parentElement.dataset.tip = X.status === 'ok' ? (X.S.connected ? `Connected to ${X.META.device.label}` : X.S.deviceError || 'Its desk is not connected') : X.error || X.status
		$('[data-g=col]', g).textContent = groupCollapsed[k] ? '▸' : '▾'
		$('[data-g=pin]', g).style.display = X.status === 'pin' ? '' : 'none'
		const body = $('.gbody', g)
		if (!X.S) body.innerHTML = `<div class="empty">${esc(X.status === 'pin' ? 'Needs its PIN. Press PIN up there.' : X.status === 'self' ? "That's this page: it's already here." : X.error ? X.error + '. Trying again…' : 'Connecting…')}</div>`
		else if (!body.querySelector('.strip')) body.innerHTML = `<div class="empty">${esc(X.S.connected ? 'No audio inputs here' : X.S.deviceError || 'Waiting for its desk…')}</div>`
		else for (const e of $$('.empty', body)) e.remove()
	}
}

// free arrangement: drag a strip by its ⠿ handle and drop it anywhere
$('#strips').addEventListener('pointerdown', (e) => {
	const h = e.target.closest('.strip .name .drag')
	if (!h || layoutMode() !== 'free') return
	e.preventDefault()
	const el = h.closest('.strip')
	const box = $('#strips')
	const rows = box.classList.contains('rows')
	movingStrip = el
	el.classList.add('moving')
	const mv = (ev) => {
		el.style.pointerEvents = 'none'
		const t = document.elementFromPoint(ev.clientX, ev.clientY)
		el.style.pointerEvents = ''
		const over = t && t.closest('#strips > .strip')
		if (!over || over === el) return
		const r = over.getBoundingClientRect()
		const after = rows ? ev.clientY > r.top + r.height / 2 : ev.clientX > r.left + r.width / 2
		box.insertBefore(el, after ? over.nextSibling : over)
	}
	const up = () => {
		removeEventListener('pointermove', mv); removeEventListener('pointerup', up)
		el.classList.remove('moving')
		movingStrip = null
		freeOrder = $$('#strips > .strip').map((x) => x.dataset.key)
		LSset('freeOrder', freeOrder)
	}
	addEventListener('pointermove', mv); addEventListener('pointerup', up)
})

// ---- the Sources panel ----
const srcEl = $('#sources')
$('#bSources').onclick = () => { if (srcEl.classList.toggle('open')) { drawSources(); pollPeers() } }
$('#srcClose').onclick = () => srcEl.classList.remove('open')
dragPanel(srcEl, $('#srcHead'), 'srcPos')
let peerTimer = null
async function pollPeers() {
	clearTimeout(peerTimer)
	try { peerList = await HOME.get('/api/peers'); drawSources() } catch {}
	peerTimer = setTimeout(pollPeers, srcEl.classList.contains('open') ? 4000 : 15000)
}
let srcSoon = null
function drawSourcesSoon() { if (!srcSoon) srcSoon = setTimeout(() => { srcSoon = null; drawSources() }, 400) }
function srcStatus(X) {
	if (!X) return '<span class="badge">not joined</span>'
	if (X.status === 'ok') return X.S && X.S.connected ? '<span class="badge ok">joined</span>' : '<span class="badge warn">joined, desk not connected</span>'
	if (X.status === 'pin') return '<span class="badge warn">needs PIN</span>'
	if (X.status === 'self') return '<span class="badge">this page</span>'
	return `<span class="badge bad">${esc(X.error || X.status)}</span>`
}
function drawSources() {
	if (!srcEl.classList.contains('open') || editing(srcEl)) return
	const body = $('#srcBody')
	const mode = layoutMode()
	const found = (peerList.peers || []).filter((p) => !(HOME.info && p.id === HOME.info.id))
	const foundUrls = new Set(found.map((p) => normUrl(p.url)))
	const row = (url, name, sub, X, opts) => `<div class="srow" style="--gc:${esc(opts.colour)}">
		${opts.tick ? `<input type="checkbox" data-tick="${esc(url)}" data-name="${esc(name)}" ${X ? 'checked' : ''} data-tip="Tick to pull this source's strips into this page">` : '<span class="swatch"></span>'}
		<div class="sinfo"><b>${esc(name)}</b><span>${esc(sub)}</span></div>${opts.status}
		<input type="color" data-colour="${esc(url)}" value="${esc(opts.colour)}" data-tip="This source's colour tag">
		${opts.remove ? `<button class="small" data-remove="${esc(url)}" data-tip="Take this source off the page${opts.manual ? ' and forget its address' : ''}">✕</button>` : ''}</div>`
	const cfgOf = (url) => srcCfg.find((c) => c.url === url)
	body.innerHTML = `<div class="card"><h4>Layout</h4><div class="row"><span class="lbl">Joined strips</span><span class="seg"><button data-lay="grouped" class="${mode === 'grouped' ? 'on' : ''}" data-tip="Each source gets its own labelled, colour-tagged block. Move blocks with ◀ ▶ and fold them with ▾.">Grouped by source</button><button data-lay="free" class="${mode === 'free' ? 'on' : ''}" data-tip="Any strip from any source, anywhere: drag a strip by the ⠿ next to its name.">Free arrangement</button></span></div>
		${mode === 'free' ? '<div class="btns" style="margin-top:6px"><button id="freeReset" data-tip="Put every strip back in source order">Reset the arrangement</button></div>' : ''}
		<p class="help">The arrangement is remembered in this browser. A joined strip's controls work its own desk, PIN and all.</p></div>
		<div class="card"><h4>This page</h4>${row('home', HOME.name, (HOME.META ? HOME.META.app.name + ' · ' : '') + location.host, HOME, { colour: HOME.colour, status: '', tick: false })}</div>
		<div class="card"><h4>Found on the network</h4>${peerList.finder === false ? '<p class="help">The finder is switched off on this connection (Companion connection settings), so nothing turns up here. You can still add pages by address below.</p>' : ''}
		${found.length ? found.map((p) => { const url = normUrl(p.url); const c = cfgOf(url); return row(url, p.name || p.appName, `${p.appName}${p.device ? ' (' + p.device + ')' : ''} · ${url.replace(/^https?:\/\//, '')}${p.pin ? ' · PIN' : ''}`, c && c.on ? sources.get(url) : null, { colour: (c && c.colour) || nextColour(), status: c && c.on ? srcStatus(sources.get(url)) : '', tick: true }) }).join('') : peerList.finder === false ? '' : '<p class="help">Nobody yet. Other OBS Audio and ATEM Audio connections on this network turn up here within a few seconds (as long as their finder is on). On another subnet or a VPN? Add it by address.</p>'}</div>
		<div class="card"><h4>Joined</h4>${srcCfg.filter((c) => c.on).map((c) => row(c.url, c.name || c.url, (sources.get(c.url) && sources.get(c.url).META ? sources.get(c.url).META.app.name + ' · ' : '') + c.url.replace(/^https?:\/\//, '') + (c.manual ? ' · added by address' : ''), sources.get(c.url), { colour: c.colour, status: srcStatus(sources.get(c.url)), tick: false, remove: true, manual: c.manual })).join('') || '<p class="help">Nothing joined yet. Tick one above, or add one below.</p>'}
		${srcCfg.filter((c) => !c.on && c.manual && !foundUrls.has(c.url)).map((c) => `<div class="srow"><div class="sinfo"><b>${esc(c.name || c.url)}</b><span>${esc(c.url)} · off</span></div><button class="small" data-rejoin="${esc(c.url)}">Join</button><button class="small" data-forget="${esc(c.url)}">✕</button></div>`).join('')}</div>
		<div class="card"><h4>Add by address</h4><div class="row"><input type="text" id="srcAddr" placeholder="192.168.1.20:8890" style="flex:1;width:auto" data-tip="Another OBS Audio or ATEM Audio page: its address and port, as in its page_url variable"><button class="primary" id="srcAdd">Add</button></div>
		<p class="help">For pages the finder can't hear: another subnet, a VPN, or a finder that's switched off.</p></div>`
	$$('[data-lay]', body).forEach((b) => b.onclick = () => { LSset('joinLayout', b.dataset.lay); render(); drawSources() })
	if ($('#freeReset', body)) $('#freeReset', body).onclick = () => { freeOrder = []; LSset('freeOrder', []); render() }
	$$('[data-tick]', body).forEach((c) => c.onchange = () => (c.checked ? joinUrl(c.dataset.tick, c.dataset.name, false) : unjoin(c.dataset.tick, false)))
	$$('[data-remove]', body).forEach((b) => b.onclick = () => unjoin(b.dataset.remove, false))
	$$('[data-forget]', body).forEach((b) => b.onclick = () => { srcCfg = srcCfg.filter((c) => c.url !== b.dataset.forget); saveSources(); drawSources() })
	$$('[data-rejoin]', body).forEach((b) => b.onclick = () => joinUrl(b.dataset.rejoin, '', true))
	$$('[data-colour]', body).forEach((x) => x.onchange = () => {
		if (x.dataset.colour === 'home') { HOME.cfg.colour = x.value; LSset('homeColour', x.value) }
		else { let c = cfgOf(x.dataset.colour); if (!c) return; c.colour = x.value; saveSources() }
		render()
	})
	$('#srcAdd', body).onclick = () => joinUrl($('#srcAddr', body).value, '', true)
	$('#srcAddr', body).onkeydown = (e) => { if (e.key === 'Enter') joinUrl(e.target.value, '', true) }
}

// ---- the Recordings tab: file manager, sheet row, naming, sheet source, uploads (for any joined source) ----
let recSrc = 'home'
let recSub = LS('recSub', 'files')
let REC = null // /rec/state of the source shown
let FILES = null
let recDraft = null // naming builder draft
let recLoadTimer = null
let preview = null // file being previewed
const fmtSize = (n) => (n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : n >= 1e3 ? Math.round(n / 1e3) + ' kB' : n + ' B')
const fmtDur = (s) => { if (s == null) return ''; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0') }
const recX = () => sources.get(recSrc) || HOME

let recSig = ''
function recStateChanged(X) {
	if (tab !== 'files' || !$('#settings').classList.contains('open') || X !== recX()) return
	const sig = JSON.stringify([X.S.recordings, X.S.recording.active, X.S.recording.lastFile])
	if (sig === recSig || recLoadTimer) return
	recSig = sig
	recLoadTimer = setTimeout(() => { recLoadTimer = null; loadRec(!!X.S.recording.lastFile) }, 400)
}

async function loadRec(files = true) {
	const X = recX()
	try {
		REC = await X.get('/rec/state')
		if (files || !FILES) FILES = await X.get('/rec/files')
	} catch (e) { REC = null; FILES = null }
	drawRec()
}

async function recCmd(c) { const j = await recX().cmd(c); await loadRec(true); return j }

function drawRec() {
	if (tab !== 'files') return
	const body = $('#sbody')
	if (editing(body) && !body.dataset.redraw) return
	delete body.dataset.redraw
	const X = recX()
	const srcPick = joined() ? `<div class="row" style="margin-bottom:8px"><span class="lbl">Source</span><select id="recSrc">${orderedSources().filter((x) => x.S).map((x) => `<option value="${esc(x.key)}" ${x.key === recSrc ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : ''
	const subs = [['files', 'Files'], ['row', 'Sheet row'], ['naming', 'Naming'], ['sheet', 'Sheet source'], ['upload', 'Upload'], ['queue', 'Upload queue']]
	const sum = REC ? REC.summary : null
	const head = srcPick + `<div class="subtabs">${subs.map(([id, l]) => `<button data-rs="${id}" class="${recSub === id ? 'on' : ''}">${l}${id === 'queue' && sum && sum.failed ? ` <span class="badge bad">${sum.failed}</span>` : ''}</button>`).join('')}</div>`
	if (!REC) { body.innerHTML = head + `<p class="help">Getting the recordings from ${esc(X.name)}…</p>`; wireRecHead(body); return }
	const off = !REC.enabled ? `<div class="warnbox"><b>Sheet naming and uploads are off.</b> Recordings keep the device's own names and stay put. <button class="primary" id="recOn">Switch them on</button></div>` : ''
	let html = ''
	if (recSub === 'files') html = recFilesHtml()
	else if (recSub === 'row') html = recRowHtml()
	else if (recSub === 'naming') html = recNamingHtml()
	else if (recSub === 'sheet') html = recSheetHtml()
	else if (recSub === 'upload') html = recUploadHtml()
	else html = recQueueHtml()
	body.innerHTML = head + (recSub === 'files' ? '' : off) + html
	wireRecHead(body)
	if ($('#recOn', body)) $('#recOn', body).onclick = () => recCmd({ cmd: 'recEnable', value: true })
	;({ files: wireRecFiles, row: wireRecRow, naming: wireRecNaming, sheet: wireRecSheet, upload: wireRecUpload, queue: wireRecQueue })[recSub](body)
}
function wireRecHead(body) {
	$$('[data-rs]', body).forEach((b) => b.onclick = () => { recSub = b.dataset.rs; LSset('recSub', recSub); recDraft = null; body.dataset.redraw = '1'; drawRec() })
	if ($('#recSrc', body)) $('#recSrc', body).onchange = (e) => { recSrc = e.target.value; REC = FILES = null; recDraft = null; preview = null; drawRec(); loadRec(true) }
}

// files
function recFilesHtml() {
	const X = recX()
	const f = FILES || { files: [] }
	const fileUrl = (n, dl) => X.base + '/rec/file' + X.q('name=' + encodeURIComponent(n) + (dl ? '&download=1' : ''))
	const pv = preview ? (() => {
		const isA = /^audio\//.test(preview.type)
		const tag = isA ? 'audio' : 'video'
		return `<div class="card preview"><h4>Playing: ${esc(preview.name)}</h4><${tag} src="${esc(fileUrl(preview.name))}" controls autoplay preload="metadata"></${tag}><p class="help">Not playing? Browsers only play some kinds of file (MP4 and MOV mostly, MKV in Chrome, FLV and TS not at all). Download it instead.</p><div class="btns"><button id="pvClose">Close</button></div></div>`
	})() : ''
	const where = `<p class="help">Folder: <span class="val">${esc(f.folder || REC.folder || 'not known yet')}</span>${REC.folderOverride ? ' (as this computer sees it)' : ''}. ${f.files.length} recording${f.files.length === 1 ? '' : 's'}.</p>`
	if (!f.ok && f.error) return pv + `<div class="warnbox"><b>Can't see the recordings.</b> ${esc(f.error)} If ${esc(X.META.device.label)} records to a different computer, put where this computer finds that folder (a mounted share) in Upload → "Recordings folder as this computer sees it".</div>`
	return pv + where + (f.files.length ? f.files.map((x) => `<div class="frow ${f.busy && x.name.toLowerCase().startsWith(String(f.busy).toLowerCase()) && X.S.recording.active ? 'busy' : ''}">
		<span class="fname">${esc(x.name)}</span><span class="fmeta">${fmtSize(x.size)}${x.duration != null ? ' · ' + fmtDur(x.duration) : ''} · ${new Date(x.modified).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
		<span class="fbtn"><button data-play="${esc(x.name)}" data-type="${esc(x.type)}" data-tip="Have a look (or a listen) right here">▶ PLAY</button><a class="btn" href="${esc(fileUrl(x.name, true))}" download data-tip="Save a copy to this computer">⤓</a><button data-ren="${esc(x.name)}" data-tip="Give it a new name (it keeps its file type)">RENAME</button><button data-up="${esc(x.name)}" data-tip="Upload this one now, whatever the upload timing says">UPLOAD</button><button data-del="${esc(x.name)}" data-tip="Delete it for good (asks first)">✕</button></span></div>`).join('') : '<p class="help">No recordings in there yet. Go on, press record.</p>') + `<div class="btns" style="margin-top:8px"><button id="fRefresh">Refresh</button></div>`
}
function wireRecFiles(body) {
	const X = recX()
	if ($('#pvClose', body)) $('#pvClose', body).onclick = () => { preview = null; drawRec() }
	if ($('#fRefresh', body)) $('#fRefresh', body).onclick = () => loadRec(true)
	$$('[data-play]', body).forEach((b) => b.onclick = () => { preview = { name: b.dataset.play, type: b.dataset.type }; drawRec() })
	$$('[data-ren]', body).forEach((b) => b.onclick = () => {
		const name = b.dataset.ren
		const dot = name.lastIndexOf('.')
		dialog('RENAME', `<h3>New name</h3><input type="text" id="rnTo" value="${esc(dot > 0 ? name.slice(0, dot) : name)}" style="width:100%"><p class="help">It keeps its ${esc(dot > 0 ? name.slice(dot) : '')} ending, so it still plays.</p><div class="btns"><button class="primary" id="rnGo">Rename</button><button id="rnNo">Cancel</button></div>`, (d) => {
			$('#rnNo', d).onclick = closeDialog
			$('#rnTo', d).focus()
			$('#rnGo', d).onclick = async () => { const to = $('#rnTo', d).value.trim(); if (!to) return; closeDialog(); await recCmd({ cmd: 'recRename', name, to }) }
		})
	})
	$$('[data-up]', body).forEach((b) => b.onclick = () => recCmd({ cmd: 'recUploadFile', name: b.dataset.up }))
	$$('[data-del]', body).forEach((b) => b.onclick = async () => {
		const name = b.dataset.del
		const ask = await X.cmd({ cmd: 'recDeleteAsk', name })
		if (!ask || !ask.ok) return
		const { token } = JSON.parse(ask.message)
		dialog('DELETE', `<h3>Are you sure?</h3><p>Delete <b>${esc(name)}</b> for good? There's no undo, and no bin to fish it out of.</p><div class="btns"><button class="primary" id="dGo" style="background:var(--red);border-color:var(--red)">Yes, delete it</button><button id="dNo">No, keep it</button></div>`, (d) => {
			$('#dNo', d).onclick = closeDialog
			$('#dGo', d).onclick = async () => { closeDialog(); if (preview && preview.name === name) preview = null; await recCmd({ cmd: 'recDelete', name, token }) }
		})
	})
}

// sheet row
function recRowHtml() {
	const r = REC.row, t = REC.table, s = REC.settings.rows
	const time = s.mode === 'time'
	const tbl = t ? `<div class="rtable"><table><thead><tr><th>#</th>${t.headers.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map((row, i) => `<tr data-pick="${i}" class="${r.index === i ? 'cur' : ''}"><td>${i + 1}</td>${row.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<p class="help">No sheet yet. Set one up in Sheet source.</p>`
	return `<div class="card"><h4>Live row</h4><div class="row"><span class="bigrow">${r.number ?? '–'}</span><span style="flex:1;padding-left:10px" class="help">${esc(r.why || '')}${r.overridden ? ' <span class="badge warn">override</span>' : ''}</span></div>
		<div class="row"><span class="lbl">Next take is called</span><span class="val" style="overflow-wrap:anywhere">${esc(REC.nextName || '…')}</span></div>
		<div class="btns" style="margin-top:6px"><button id="rPrev" data-tip="The row before">◀ PREVIOUS</button><button id="rNext" class="primary" data-tip="The next row (next session)">NEXT ▶</button>${time ? `<button id="rRel" ${r.overridden ? '' : 'disabled'} data-tip="Let go of the manual pick and go back to matching by time">RELEASE</button>` : ''}</div></div>
		<div class="card"><h4>Rows${t ? ' (' + t.rows.length + ')' : ''}</h4><p class="help">Tap a row to make it live.${time ? ' Matching by time: a tap overrides it ' + (s.overrideHold === 'untilNextSlot' ? 'until the next time slot starts.' : 'until you press Release.') : ''}</p>${tbl}</div>
		<div class="card"><h4>How the row is chosen</h4><div class="grid2 rform">
		${recSel('rows.mode', 'Row chosen', s.mode, [['manual', 'By hand (pick, next, previous)'], ['time', 'Match by time (start / end columns)']], 'By hand: you (or Companion) choose. By time: the row whose start and end times cover now is live, and you can still override.')}
		${recChk('rows.autoAdvance', 'Next row after each recording', s.autoAdvance, 'Steps to the next row each time a recording stops: handy for back-to-back sessions.')}
		${recChk('rows.wrap', 'Wrap round from the last row to the first', s.wrap, '')}
		${recColSel('rows.keyColumn', 'Key column (for "set by value")', s.keyColumn, t, 'A column with a code per session. Companion can then set the row by that code (or a variable holding it).')}
		${time ? recColSel('rows.startColumn', 'Start time column', s.startColumn, t, '') + recColSel('rows.endColumn', 'End time column (blank = until the next start)', s.endColumn, t, '') + recColSel('rows.dateColumn', 'Date column (blank = today)', s.dateColumn, t, '') + recSel('rows.dateOrder', 'Dates are written', s.dateOrder, [['dmy', 'Day first (04/11/2026)'], ['mdy', 'Month first (11/04/2026)']], '') + recSel('rows.overrideHold', 'A manual pick holds', s.overrideHold, [['untilNextSlot', 'Until the next time slot'], ['untilReleased', 'Until released']], '') + recChk('rows.keepLastWhenNoSlot', 'Between slots, keep the last row', s.keepLastWhenNoSlot, 'Off: no row (names fall back to date and time) when nothing is scheduled.') + recNum('rows.leadSeconds', 'Start a slot early by (seconds)', s.leadSeconds, '') : ''}
		</div></div>`
}
function wireRecRow(body) {
	if ($('#rPrev', body)) $('#rPrev', body).onclick = () => recCmd({ cmd: 'recRow', op: 'previous' })
	if ($('#rNext', body)) $('#rNext', body).onclick = () => recCmd({ cmd: 'recRow', op: 'next' })
	if ($('#rRel', body)) $('#rRel', body).onclick = () => recCmd({ cmd: 'recRow', op: 'release' })
	$$('[data-pick]', body).forEach((tr) => tr.onclick = () => recCmd({ cmd: 'recRow', op: 'pick', index: +tr.dataset.pick }))
	wireRecFields(body)
}

// small form helpers: data-rk="section.key"
function recSel(k, label, v, opts, tip) { return `<div class="row" data-tip="${esc(tip)}"><span class="lbl">${esc(label)}</span><select data-rk="${k}">${opts.map(([id, l]) => `<option value="${esc(id)}" ${String(v) === id ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>` }
function recChk(k, label, v, tip) { return `<div class="row" data-tip="${esc(tip)}"><span class="lbl">${esc(label)}</span><select data-rk="${k}" data-bool="1"><option value="true" ${v ? 'selected' : ''}>Yes</option><option value="false" ${!v ? 'selected' : ''}>No</option></select></div>` }
function recNum(k, label, v, tip) { return `<div class="row" data-tip="${esc(tip)}"><span class="lbl">${esc(label)}</span><input type="number" data-rk="${k}" data-num="1" value="${esc(v)}" step="any"></div>` }
function recText(k, label, v, tip, type = 'text', ph = '') { return `<div class="row" data-tip="${esc(tip)}"><span class="lbl">${esc(label)}</span><input type="${type}" data-rk="${k}" value="${esc(v)}" placeholder="${esc(ph)}"></div>` }
function recColSel(k, label, v, t, tip) { const cols = t ? t.headers : []; const opts = [['', '(none)'], ...cols.map((c) => [c, c])]; if (v && !cols.includes(v)) opts.push([v, v + ' (not in the sheet)']); return recSel(k, label, v, opts, tip) }
function wireRecFields(body) {
	$$('[data-rk]', body).forEach((x) => x.addEventListener('change', () => {
		const [sec, key] = x.dataset.rk.split('.')
		let v = x.value
		if (x.dataset.bool) v = v === 'true'
		else if (x.dataset.num) { v = Number(v); if (Number.isNaN(v)) return flash('That needs a number') }
		else if (x.dataset.list) v = v.split(',').map((t) => t.trim()).filter(Boolean)
		recCmd({ cmd: 'recConfigure', settings: { [sec]: { [key]: v } } })
	}))
}

// naming builder
function recNamingHtml() {
	const n = recDraft || (recDraft = JSON.parse(JSON.stringify(REC.settings.naming)))
	const cols = REC.table ? REC.table.headers : []
	const tokens = [['date', 'Date'], ['time', 'Time'], ['source', 'Source name'], ['take', 'Take number'], ['row', 'Row number']]
	const label = (p) => (p.startsWith('text:') ? '"' + p.slice(5) + '"' : p.startsWith('var:') ? '$(' + p.slice(4) + ')' : (tokens.find((t) => t[0] === p) || [p, p])[1])
	return `<div class="card"><h4>The name</h4><p class="help">Pick what goes in the name, in order. Tap a part to take it out; ◀ ▶ move it.</p>
		<div class="chips" id="nParts">${n.parts.map((p, i) => `<span class="chip">${esc(label(p))}<button data-nl="${i}" data-tip="Earlier">◀</button><button data-nr="${i}" data-tip="Later">▶</button><button data-nx="${i}" data-tip="Take it out">✕</button></span>`).join('') || '<span class="help">Nothing yet: pick some below.</span>'}</div>
		<p class="lbl" style="margin:10px 0 4px">Sheet columns</p><div class="chips">${cols.map((c) => `<span class="chip add" data-nadd="${esc(c)}">+ ${esc(c)}</span>`).join('') || '<span class="help">No sheet yet (Sheet source).</span>'}</div>
		<p class="lbl" style="margin:10px 0 4px">Other bits</p><div class="chips">${tokens.map(([id, l]) => `<span class="chip add" data-nadd="${id}">+ ${esc(l)}</span>`).join('')}<span class="chip add" id="nText">+ Some text…</span><span class="chip add" id="nVar">+ A Companion variable…</span></div>
		<div class="grid2 rform" style="margin-top:10px">
		<div class="row" data-tip="Goes between the parts. Empty parts are skipped, so no double dashes."><span class="lbl">Between parts</span><input type="text" id="nSep" value="${esc(n.separator)}"></div>
		<div class="row" data-tip="YYYY, YY, MM, DD"><span class="lbl">Date looks like</span><input type="text" id="nDate" value="${esc(n.dateFormat)}"></div>
		<div class="row" data-tip="HH, mm, ss (no colons: they can't go in file names)"><span class="lbl">Time looks like</span><input type="text" id="nTime" value="${esc(n.timeFormat)}"></div>
		<div class="row" data-tip="When the name's already used: add (2), or a take number"><span class="lbl">Name already used</span><select id="nColl"><option value="suffix" ${n.collision === 'suffix' ? 'selected' : ''}>Add (2), (3)…</option><option value="take" ${n.collision === 'take' ? 'selected' : ''}>Add a take number</option></select></div>
